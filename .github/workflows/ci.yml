# GitHub Actions Workflow · ai-team-intro
# Fleet template: 純靜態 HTML → GitHub Pages
# 11 個 HTML 入口，無需 npm build

name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ai-team-intro 是純靜態 HTML（11 個入口），無需 npm build
  # 直接把 repo 根目錄部署到 GitHub Pages
  # index.html 重導向到 index-zh.html（繁中預設）

  link-check:
    name: Link Check (static HTML)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify HTML files exist
        run: |
          echo "--- 11 個 HTML 入口檢查 ---"
          for f in index.html index-zh.html index-en.html dashboard.html \
                   meeting_summary.html meeting_summary_v2.html \
                   compound_calculator.html leaderboard.html \
                   hot_topic_tracker.html marathon_bracelet.html \
                   ai_intel_assistant.html create.html; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ MISSING: $f"
              exit 1
            fi
          done
      - name: Check internal links
        run: |
          echo "--- 內部連結檢查 ---"
          broken=0
          for f in *.html; do
            # 抓所有 .html 相對連結
            for link in $(grep -oE 'href="[^"]*\.html"' "$f" 2>/dev/null | tr -d '"' | sed 's/href=//'); do
              if [ ! -f "$link" ]; then
                echo "❌ $f → $link (NOT FOUND)"
                broken=$((broken + 1))
              fi
            done
          done
          if [ $broken -gt 0 ]; then
            echo "Found $broken broken links"
            exit 1
          fi
          echo "✅ All internal links valid"

  deploy:
    name: Deploy to Pages
    runs-on: ubuntu-latest
    needs: [link-check]
    if: (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && github.event_name == 'push'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload to Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
          # 上傳整個 repo 根目錄（11 個 HTML + assets）

      - name: Deploy to Pages
        id: deployment
        uses: actions/deploy-pages@v4
